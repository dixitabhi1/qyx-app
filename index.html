<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#728c69">
<title>QYX MedTech | Semen Analysis</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box;
         background: #fafaf4; color: #243e2e; font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Arial, sans-serif; }
  .card { max-width: 420px; width: 100%; background: #fff; border: 1px solid #d6e1d1; border-radius: 26px; padding: 36px 28px;
          text-align: center; box-shadow: 0 30px 90px rgba(15, 30, 20, .12); }
  .logo { width: 56px; height: 56px; border-radius: 14px; background: #0f301d; color: #fbf3e6; display: inline-grid; place-items: center;
          font: 900 17px/1 "Arial Black", Arial, sans-serif; letter-spacing: -.5px; }
  h1 { font: 400 26px/1.25 Georgia, "Times New Roman", serif; margin: 18px 0 8px; }
  p { color: #526556; margin: 0 0 20px; line-height: 1.55; }
  .spin { width: 22px; height: 22px; border: 2px solid #d6e1d1; border-top-color: #557a60; border-radius: 50%;
          animation: s .7s linear infinite; margin: 0 auto 18px; }
  @keyframes s { to { transform: rotate(360deg); } }
  a.btn { display: inline-block; background: #557a60; color: #fff; text-decoration: none; font-weight: 600;
          padding: 12px 28px; border-radius: 999px; }
  a.btn:hover { background: #35583e; }
  .err { display: none; }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
</style>
</head>
<body>
<main class="card">
  <div class="logo" aria-hidden="true">QYX</div>
  <h1>QYX semen analysis</h1>
  <div id="wait"><div class="spin" aria-hidden="true"></div><p>Opening the sign-in page…</p></div>
  <div id="err" class="err"><p>The analysis service is offline right now. Please try again in a few minutes, or contact QYX MedTech.</p>
    <a class="btn" href="https://qyxmedtech.com/">Back to qyxmedtech.com</a></div>
  <noscript><p>Please enable JavaScript to continue.</p></noscript>
</main>
<script>
  // target.json holds the app's current public address; it is rewritten each time the
  // app server starts (deploy/windows/run-public.ps1). The query string skips caches.
  fetch('target.json?t=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (t) {
      if (!t.url || t.online === false) throw new Error('offline');
      location.replace(t.url.replace(/\/$/, '') + '/login');
    })
    .catch(function () {
      document.getElementById('wait').style.display = 'none';
      document.getElementById('err').style.display = 'block';
    });
</script>
</body>
</html>
